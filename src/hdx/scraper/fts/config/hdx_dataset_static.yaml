caveats: |
  Please see [About FTS](https://fts.unocha.org/content/about-fts-what-fts).

  In the requirements and funding files, isPartOfGHO is Y if the plan was part of the Global Humanitarian Overview (GHO) in that year. "Not specified" rows are funding to the location outside any plan.

  Country files contain only funding attributed to that country. The global requirements and funding file also has rows for funding to non-country locations (Global, regions, location not specified), funding shared across several locations, and plan requirements and funding not attributed to a single country, identified by the location and locationType columns.
methodology: "Other"
methodology_other: "FTS is open to all government and private donors, funds, recipient agencies and implementing organizations wishing to report financial pledges and contributions for humanitarian action. FTS team curates the reported data by manually reviewing, validating and reconciling incoming information and updating FTS data records on an ongoing basis."
dataset_source: "OCHA Financial Tracking Service"
private: False  # has to be True or False
